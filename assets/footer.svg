<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="Closing quote" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d1b0d"/><stop offset="1" stop-color="#150d07"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c9952b"/><stop offset=".5" stop-color="#fbeaa6"/><stop offset="1" stop-color="#c9952b"/></linearGradient>
</defs>
<rect width="1200" height="170" rx="10" fill="url(#bg)"/>
<rect x="8" y="8" width="1184" height="154" rx="6" fill="none" stroke="#c9952b" stroke-width="1.5" opacity=".7"/>
<g font-family="Georgia, 'Palatino Linotype', 'Times New Roman', serif" text-anchor="middle">
  <text x="600" y="70" font-size="26" font-style="italic" fill="#f0dfb0">"A class is a library of possibilities;</text>
  <text x="600" y="106" font-size="26" font-style="italic" fill="#f0dfb0">an object is the book you take home."
    <animate attributeName="opacity" values=".85;1;.85" dur="5s" repeatCount="indefinite"/></text>
  <text x="604" y="142" font-size="13" letter-spacing="6" fill="url(#gold)">THANKS FOR VISITING THE STACKS</text>
</g>
</svg>